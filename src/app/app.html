<div class="layout" [class.layout--sidebar-open]="sidebarOpen()">

  <!-- BACKDROP OVERLAY FOR MOBILE -->
  <div class="layout__backdrop" *ngIf="sidebarOpen()" (click)="closeSidebar()" aria-hidden="true"></div>

  <!-- LEFT DARK SIDEBAR (Matches exact mockup) -->
  <aside class="sidebar" [class.sidebar--open]="sidebarOpen()" aria-label="Navigation latérale">
    <!-- Brand / Logo -->
    <div class="sidebar__brand">
      <a routerLink="/dashboard" class="sidebar__logo-link" (click)="closeSidebar()">
        <span class="sidebar__logo-icon">
          <!-- Stylized green T logo box -->
          <svg viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="#10b981"/>
            <path d="M8 10H24M16 10V24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="sidebar__brand-text">
          <span class="brand-white">Task</span><span class="brand-green">ly</span>
        </span>
      </a>

      <!-- Close button on mobile -->
      <button class="sidebar__close-btn" (click)="closeSidebar()" aria-label="Fermer le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Navigation List -->
    <nav class="sidebar__nav">
      <ul class="sidebar__menu">
        <li *ngFor="let item of navItems">
          <a [routerLink]="item.route"
             routerLinkActive="sidebar__link--active"
             class="sidebar__link"
             (click)="closeSidebar()">
            <!-- Icon -->
            <span class="sidebar__link-icon">
              <!-- Home -->
              <svg *ngIf="item.icon === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>

              <!-- Projects -->
              <svg *ngIf="item.icon === 'projects'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>

              <!-- Users -->
              <svg *ngIf="item.icon === 'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>

              <!-- Statistics -->
              <svg *ngIf="item.icon === 'stats'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
              </svg>

              <!-- Messages -->
              <svg *ngIf="item.icon === 'messages'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>

              <!-- Settings -->
              <svg *ngIf="item.icon === 'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </span>

            <span class="sidebar__link-text">{{ item.label }}</span>
            <span class="sidebar__link-active-tab" aria-hidden="true"></span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Sidebar footer badge -->
    <div class="sidebar__badge-card">
      <div class="sidebar__badge-dot"></div>
      <div>
        <div class="sidebar__badge-title">Espace Taskly</div>
        <div class="sidebar__badge-sub">4 composants LibraryUI</div>
      </div>
    </div>
  </aside>

  <!-- MAIN AREA (Header + View content) -->
  <div class="layout__main">

    <!-- TOP HEADER BAR -->
    <header class="topbar">
      <!-- Left side: Hamburger (mobile) & Search bar -->
      <div class="topbar__left">
        <button class="topbar__hamburger" (click)="toggleSidebar()" aria-label="Ouvrir le menu">
          <span></span><span></span><span></span>
        </button>

        <div class="topbar__search">
          <svg class="topbar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text"
                 placeholder="Rechercher..."
                 aria-label="Recherche globale"
                 (keyup.enter)="onSearch($event)" />
        </div>
      </div>

      <!-- Right side: Notifications, Theme toggle, Avatar -->
      <div class="topbar__right">
        <!-- Bell Notification -->
        <button class="topbar__action-btn" aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="topbar__badge-dot" aria-hidden="true"></span>
        </button>

        <!-- Theme Toggle -->
        <button class="topbar__action-btn"
                [attr.aria-label]="theme.theme() === 'dark' ? 'Mode clair' : 'Mode sombre'"
                [title]="theme.theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'"
                (click)="theme.toggle()">
          <svg *ngIf="theme.theme() === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg *ngIf="theme.theme() === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <!-- User Profile Avatar -->
        <a routerLink="/settings" class="topbar__avatar-btn" aria-label="Profil et paramètres">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%236366f1'/><circle cx='50' cy='40' r='20' fill='%23fed7aa'/><path d='M30 30c0-10 9-16 20-16s20 6 20 16c-4-4-10-6-20-6s-16 2-20 6z' fill='%23312e81'/><path d='M18 95c0-18 15-30 32-30s32 12 32 30' fill='%234338ca'/><circle cx='43' cy='39' r='2.5' fill='%231e1b4b'/><circle cx='57' cy='39' r='2.5' fill='%231e1b4b'/><path d='M46 46c2 2 6 2 8 0' stroke='%231e1b4b' stroke-width='2' stroke-linecap='round' fill='none'/></svg>"
               alt="Photo de profil"
               class="topbar__avatar-img" />
        </a>
      </div>
    </header>

    <!-- ROUTED CONTENT -->
    <main class="layout__content" id="main">
      <router-outlet />
    </main>

    <!-- FOOTER -->
    <footer class="layout__footer">
      <span>© {{ year }} <strong>Taskly</strong> · Tableau de bord SaaS propulsé par les 4 composants officiels LibraryUI.</span>
    </footer>
  </div>

</div>

<!-- DIALOGS & NOTIFICATIONS -->
<app-project-modal />
<app-toaster />
