<div class="dash">

  <!-- ROW 1 : 3 KPI STAT CARDS -->
  <section class="kpi-grid" aria-label="Indicateurs clés">
    <div class="kpi-card" *ngFor="let kpi of kpis">
      <div class="kpi-card__icon-box" [style.background-color]="kpi.color">
        <!-- Projets icon -->
        <svg *ngIf="kpi.icon === 'projects'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>

        <!-- Utilisateurs icon -->
        <svg *ngIf="kpi.icon === 'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>

        <!-- Satisfaction icon -->
        <svg *ngIf="kpi.icon === 'satisfaction'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </div>

      <div class="kpi-card__info">
        <div class="kpi-card__value">{{ kpi.value }}</div>
        <div class="kpi-card__label">{{ kpi.label }}</div>
      </div>
    </div>
  </section>

  <!-- ROW 2 : CHARTS (Activité récente & Répartition) -->
  <section class="chart-grid">
    <!-- Activité récente -->
    <article class="card activity-card">
      <header class="card__header">
        <h2 class="card__title">Activité récente</h2>
      </header>

      <div class="activity-chart">
        <svg class="activity-svg" viewBox="0 0 650 250" preserveAspectRatio="none">
          <defs>
            <linearGradient id="curveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
              <stop offset="60%" stop-color="#10b981" stop-opacity="0.08" />
              <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
            </linearGradient>
            <!-- Drop shadow for floating tooltip -->
            <filter id="tooltipShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
            </filter>
          </defs>

          <!-- Area beneath spline curve -->
          <path class="area-fill" fill="url(#curveGradient)"
            d="M 40 170
               C 85 170, 95 190, 135 190
               C 175 190, 195 145, 235 145
               C 275 145, 285 165, 325 165
               C 365 165, 385 75, 420 75
               C 455 75, 475 150, 515 150
               C 555 150, 570 110, 610 110
               L 610 220 L 40 220 Z" />

          <!-- Spline Line -->
          <path class="curve-line"
            d="M 40 170
               C 85 170, 95 190, 135 190
               C 175 190, 195 145, 235 145
               C 275 145, 285 165, 325 165
               C 365 165, 385 75, 420 75
               C 455 75, 475 150, 515 150
               C 555 150, 570 110, 610 110"
            fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Mai peak point -->
          <circle cx="420" cy="75" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />

          <!-- Floating Tooltip (+24%) directly over Mai peak -->
          <g class="tooltip-badge" filter="url(#tooltipShadow)">
            <!-- Pill rect -->
            <rect x="391" y="24" width="58" height="26" rx="6" fill="#0f172a" />
            <!-- Caret pointing down -->
            <polygon points="415,50 425,50 420,55" fill="#0f172a" />
            <!-- Text +24% -->
            <text x="420" y="42" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'Inter', sans-serif">+24%</text>
          </g>
        </svg>

        <!-- X Axis Month Labels -->
        <div class="axis-months">
          <span>Jan</span>
          <span>Fév</span>
          <span>Mar</span>
          <span>Avr</span>
          <span>Mai</span>
          <span>Juin</span>
          <span>Juil</span>
        </div>
      </div>
    </article>

    <!-- Répartition (Donut) -->
    <article class="card donut-card">
      <header class="card__header">
        <h2 class="card__title">Répartition</h2>
      </header>

      <div class="donut-content">
        <div class="donut-chart-wrap">
          <svg class="donut-svg" viewBox="0 0 160 160">
            <!-- Background base ring -->
            <circle cx="80" cy="80" r="58" fill="none" stroke="#f1f5f9" stroke-width="20" />

            <!-- Colored segments -->
            <circle *ngFor="let seg of donutSegments"
              cx="80" cy="80" r="58"
              fill="none"
              [attr.stroke]="seg.color"
              stroke-width="20"
              [attr.stroke-dasharray]="seg.dashArray"
              [attr.stroke-dashoffset]="seg.offset"
              transform="rotate(-90 80 80)" />
          </svg>
        </div>

        <!-- Legend matching mockup -->
        <ul class="donut-legend">
          <li *ngFor="let item of donutData" class="donut-legend__item">
            <span class="donut-legend__dot" [style.background-color]="item.color"></span>
            <span class="donut-legend__label">{{ item.label }}</span>
            <span class="donut-legend__pct">{{ item.pct }}%</span>
          </li>
        </ul>
      </div>
    </article>
  </section>

  <!-- ROW 3 : LISTS (Projets récents & Membres) -->
  <section class="lists-grid">
    <!-- Projets récents -->
    <article class="card">
      <header class="card__header">
        <h2 class="card__title">Projets récents</h2>
      </header>

      <ul class="projects-list">
        <li *ngFor="let p of recentProjects" class="project-row" routerLink="/projects" role="button" tabindex="0">
          <div class="project-row__icon-box" [style.background-color]="p.color">
            <!-- E-learning / book -->
            <svg *ngIf="p.icon === 'book'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>

            <!-- Mobile app -->
            <svg *ngIf="p.icon === 'mobile'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
              <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>

            <!-- Dashboard analytics -->
            <svg *ngIf="p.icon === 'chart'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>

          <div class="project-row__info">
            <h3 class="project-row__name">{{ p.title }}</h3>
            <span class="project-row__time">{{ p.time }}</span>
          </div>

          <span class="badge" [ngClass]="p.badgeType === 'success' ? 'badge--success' : 'badge--info'">
            {{ p.badge }}
          </span>
        </li>
      </ul>
    </article>

    <!-- Membres -->
    <article class="card">
      <header class="card__header">
        <h2 class="card__title">Membres</h2>
      </header>

      <ul class="members-list">
        <li *ngFor="let m of members" class="member-row" routerLink="/users" role="button" tabindex="0">
          <div class="member-row__avatar-wrap">
            <img [src]="m.avatar" [alt]="m.name" class="member-row__avatar" loading="lazy" />
          </div>

          <div class="member-row__info">
            <h3 class="member-row__name">{{ m.name }}</h3>
            <span class="member-row__role">{{ m.role }}</span>
          </div>

          <span class="status-dot" [class.status-dot--online]="m.status === 'online'" aria-label="En ligne"></span>
        </li>
      </ul>
    </article>
  </section>

</div>
